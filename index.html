<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swarg-Core Ultimate | Amar Kumar</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- MASTER THEME & VARIABLES --- */
        :root {
            --neon-blue: #00f3ff;
            --deep-space: #020205;
            --gold-leaf: #ffcc00;
            --glass-white: rgba(255, 255, 255, 0.05);
            --sharp-red: #ff003c;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background: var(--deep-space); color: #fff;
            font-family: 'Rajdhani', sans-serif; overflow: hidden;
        }

        /* --- AMAR KUMAR BRANDING --- */
        .master-header {
            position: fixed; top: 0; width: 100%; height: 65px;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(25px);
            border-bottom: 2px solid var(--neon-blue);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }

        .dev-name {
            font-family: 'Orbitron', sans-serif; font-weight: 700;
            font-size: 1.1rem; color: var(--gold-leaf); text-shadow: 0 0 15px var(--gold-leaf);
            display: flex; align-items: center; letter-spacing: 2px;
        }

        .verified-tick {
            margin-left: 10px; width: 22px; height: 22px;
            background: #1da1f2; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: white; box-shadow: 0 0 20px #1da1f2;
            animation: pulse-tick 2s infinite;
        }

        @keyframes pulse-tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* --- THE SENTIENT CORE --- */
        .core-stage {
            height: 100%; display: flex; flex-direction: column; padding-top: 70px;
        }

        .visualizer-box {
            height: 30%; display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        .swarg-orb {
            width: 140px; height: 140px;
            background: radial-gradient(circle, var(--neon-blue) 0%, transparent 70%);
            border-radius: 50%; filter: contrast(150%) brightness(120%);
            position: relative; transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .orb-inner {
            position: absolute; inset: 10%; border: 2px solid white;
            border-radius: 50%; animation: spin 4s linear infinite; opacity: 0.3;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- CONVERSATION INTERFACE --- */
        #chat-engine {
            flex: 1; overflow-y: scroll; padding: 25px 15px;
            display: flex; flex-direction: column; gap: 20px;
            scrollbar-width: none;
        }

        .bubble {
            max-width: 80%; padding: 18px; border-radius: 25px;
            font-size: 1.1rem; position: relative; animation: slideUp 0.4s ease;
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .ai-bubble {
            background: var(--glass-white); border: 1px solid rgba(0, 243, 255, 0.2);
            align-self: flex-start; border-bottom-left-radius: 5px;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
        }

        .user-bubble {
            background: linear-gradient(145deg, #00f3ff, #0072ff);
            align-self: flex-end; border-bottom-right-radius: 5px;
            color: #000; font-weight: 600;
        }

        /* --- HIGH-TECH CONTROL BAR --- */
        .control-pod {
            background: #0a0a10; padding: 15px; border-top: 1px solid #1a1a25;
            display: flex; align-items: center; gap: 12px; padding-bottom: 30px;
        }

        .action-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            background: var(--glass-white); color: #fff; font-size: 1.4rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(255,255,255,0.05);
        }

        .input-field {
            flex: 1; background: #151520; border: 1px solid #252535;
            border-radius: 30px; padding: 15px 25px; color: #fff;
            font-size: 1.1rem; outline: none; transition: 0.3s;
        }

        .input-field:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }

        .send-pill {
            background: var(--gold-leaf); color: #000; font-weight: 800;
            padding: 12px 25px; border-radius: 25px; border: none; text-transform: uppercase;
        }

        /* --- LOADING OVERLAY --- */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

<div id="loader">
    <h2 style="color: var(--gold-leaf); font-family: 'Orbitron';">SWARG-CORE ULTIMATE</h2>
    <p>Booting Neural Systems...</p>
</div>

<div class="master-header">
    <div class="dev-name">DEVELOPED BY AMAR KUMAR <div class="verified-tick">✔</div></div>
</div>

<div class="core-stage">
    <div class="visualizer-box">
        <div class="swarg-orb" id="orb">
            <div class="orb-inner"></div>
        </div>
    </div>

    <div id="chat-engine"></div>

    <div class="control-pod">
        <button class="action-btn" onclick="triggerFile()">📎</button>
        <input type="file" id="fileInp" hidden onchange="analyzeFile()">
        
        <input type="text" id="userInput" placeholder="Ask anything, Boss..." onkeypress="if(event.key==='Enter') processInput()">
        
        <button class="action-btn" id="voiceToggle" onclick="startListening()">🎤</button>
        <button class="send-pill" onclick="processInput()">Bhejein</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat-engine');
    const input = document.getElementById('userInput');
    const orb = document.getElementById('orb');
    let userName = "";

    // --- SYSTEM BOOT ---
    setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
        botTalk("Swarg-Core Ultimate Online. Developed by Amar Kumar. Aapka naam kya hai, sir?");
    }, 2500);

    function botTalk(text) {
        const div = document.createElement('div');
        div.className = "bubble ai-bubble";
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTo(0, chat.scrollHeight);
        speakOut(text);
    }

    function processInput() {
        const val = input.value.trim();
        if(!val) return;

        const div = document.createElement('div');
        div.className = "bubble user-bubble";
        div.innerText = val;
        chat.appendChild(div);
        input.value = "";
        chat.scrollTo(0, chat.scrollHeight);

        // --- BRAIN LOGIC ---
        setTimeout(() => {
            handleIntelligence(val);
        }, 800);
    }

    function handleIntelligence(msg) {
        if(!userName) {
            userName = msg;
            botTalk(`Swagat hai ${userName}! Aap mere master Amar Kumar ke guest hain. Main ek Super AI hoon. Mujhe photos, videos bhejye ya real-time news puchiye.`);
            return;
        }

        // --- EMOTIONAL INTELLIGENCE SIMULATION ---
        let response = "";
        const m = msg.toLowerCase();

        if(m.includes("joke") || m.includes("hanso")) {
            orb.style.boxShadow = "0 0 60px #ffcc00";
            response = "Haha! AI ho kar bhi mere pas Bihar ke laundo wala swag hai. Ek joke suno...";
        } else if(m.includes("ghussa") || m.includes("angry")) {
            orb.style.boxShadow = "0 0 80px #ff003c";
            response = "Master Amar ne mujhe shanti sikhayi hai, lekin aapka behaviour dekh kar mera temperature high ho raha hai. Thanda lijiye!";
        } else {
            orb.style.boxShadow = "0 0 50px #00f3ff";
            response = `Interesting point, ${userName}. Mere real-time analysis ke hisab se iska jawab bahut bada hai. Kya main internet se full data fetch karun?`;
        }
        botTalk(response);
    }

    // --- MULTIMODAL SIMULATION ---
    function triggerFile() { document.getElementById('fileInp').click(); }
    function analyzeFile() {
        botTalk("Analyzing file... Isme high-level neural scanning ho rahi hai. Master Amar ne mujhe vision features se upar rakha hai.");
    }

    // --- VOICE ENGINE ---
    function startListening() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';
        recognition.start();
        document.getElementById('voiceToggle').style.color = 'var(--neon-blue)';
        
        recognition.onresult = (e) => {
            input.value = e.results[0][0].transcript;
            processInput();
            document.getElementById('voiceToggle').style.color = '#fff';
        };
    }

    function speakOut(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'hi-IN';
        speech.pitch = 1.1;
        window.speechSynthesis.speak(speech);
    }
</script>
</body>
</html>
