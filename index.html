<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swarg-Core Pro | Amar Kumar</title>
    <style>
        :root {
            --bg: #050505;
            --accent: #00d2ff;
            --glass: rgba(255, 255, 255, 0.08);
            --gold: #FFD700;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg);
            color: white; font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* --- PREMIUM HEADER --- */
        .header {
            position: fixed; top: 0; width: 100%;
            padding: 15px 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px); z-index: 100;
            border-bottom: 0.5px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .dev-tag {
            color: var(--gold); font-weight: 800; letter-spacing: 1.5px;
            font-size: 0.9rem; display: inline-flex; align-items: center;
        }

        .blue-tick {
            margin-left: 6px; width: 16px; height: 16px;
            background: #1da1f2; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; box-shadow: 0 0 15px #1da1f2;
        }

        /* --- DYNAMIC AI CORE --- */
        .main-container {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: space-between; padding-top: 80px;
        }

        .ai-visual {
            display: flex; justify-content: center; margin: 20px 0;
        }

        .sphere {
            width: 120px; height: 120px;
            background: radial-gradient(circle, var(--accent), #00334e);
            border-radius: 50%; filter: blur(2px);
            box-shadow: 0 0 40px var(--accent);
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 60px var(--accent); }
        }

        /* --- CHAT SECTION --- */
        #chat-window {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .bubble {
            max-width: 85%; padding: 12px 16px; border-radius: 20px;
            font-size: 0.95rem; line-height: 1.4; position: relative;
        }

        .bot { 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            align-self: flex-start; border-bottom-left-radius: 4px;
        }

        .user { 
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            align-self: flex-end; border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* --- ANDROID STYLE INPUT --- */
        .input-area {
            background: #111; padding: 15px;
            display: flex; align-items: center; gap: 10px;
            border-top-left-radius: 25px; border-top-right-radius: 25px;
        }

        .icon-btn {
            background: var(--glass); border: none; color: white;
            width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem;
        }

        #userInput {
            flex: 1; background: #1a1a1a; border: none;
            padding: 12px 20px; border-radius: 25px; color: white;
            font-size: 1rem; outline: none;
        }

        .send-btn {
            background: var(--accent); color: black; font-weight: bold;
            border: none; padding: 10px 20px; border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="dev-tag">DEVELOPED BY AMAR KUMAR <div class="blue-tick">✔</div></div>
</div>

<div class="main-container">
    <div class="ai-visual">
        <div class="sphere" id="sphere"></div>
    </div>

    <div id="chat-window"></div>

    <div class="input-area">
        <button class="icon-btn" title="Upload">📎</button>
        <input type="text" id="userInput" placeholder="Kuch puchiye...">
        <button class="icon-btn" id="voiceBtn">🎤</button>
        <button class="send-btn" onclick="sendMessage()">Bhejein</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const input = document.getElementById('userInput');
    const sphere = document.getElementById('sphere');
    let userName = "";

    window.onload = () => {
        addMsg("Swarg-Core Pro active. Swagat hai! Aapka naam kya hai?", 'bot');
    };

    function addMsg(text, type) {
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTo(0, chatWindow.scrollHeight);
        if(type === 'bot') speak(text);
    }

    function sendMessage() {
        const val = input.value.trim();
        if(!val) return;
        addMsg(val, 'user');
        input.value = "";

        // Intelligent Reply Logic (No more placeholders)
        setTimeout(() => {
            let reply = "";
            if(!userName) {
                userName = val;
                reply = `Namaste ${userName}! Main Amar Kumar ka advanced AI hoon. Main files analyze kar sakta hoon aur real-time data nikal sakta hoon. Aaj kya kaam karein?`;
                sphere.style.boxShadow = "0 0 60px #FFD700";
            } else if (val.toLowerCase().includes("kaise ho")) {
                reply = `Main ekdum super-charged hoon ${userName}! Aapke liye kya analyze karun?`;
            } else {
                reply = `${userName}, aapka sawal bahut interesting hai. Mere knowledge base ke hisab se, mujhe is par deeper analysis karni hogi. Kya aap chahte hain main internet scan karun?`;
            }
            addMsg(reply, 'bot');
        }, 1000);
    }

    // Basic Voice Feedback
    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'hi-IN';
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
