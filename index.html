<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarg-Core AI | Amar Kumar</title>
    <style>
        /* --- GLOBAL STYLES --- */
        :root {
            --gold: #ffd700;
            --blue-tick: #1da1f2;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a1a2e, #16213e, #0f3460);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER & BRANDING --- */
        header {
            padding: 20px;
            text-align: center;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .dev-info {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
        }

        .blue-tick {
            background: var(--blue-tick);
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.7rem;
            margin-left: 8px;
            box-shadow: 0 0 10px var(--blue-tick);
            animation: glow 2s infinite ease-in-out;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px var(--blue-tick); }
            50% { box-shadow: 0 0 20px var(--blue-tick); }
        }

        /* --- AI CORE SPHERE --- */
        #ai-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ai-core {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #4ecca3, #00adb5);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(78, 204, 163, 0.5);
            animation: pulse 4s infinite;
            transition: all 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 80px rgba(78, 204, 163, 0.8); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* --- CHAT AREA --- */
        #chat-box {
            width: 90%;
            max-width: 600px;
            height: 300px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin: 20px 0;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .message {
            margin: 10px 0;
            padding: 12px 18px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.5;
        }

        .bot-msg { background: rgba(0, 173, 181, 0.2); align-self: flex-start; border-left: 4px solid #00adb5; }
        .user-msg { background: rgba(255, 255, 255, 0.1); align-self: flex-end; margin-left: auto; text-align: right; }

        /* --- INPUTS --- */
        .controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: var(--glass);
            backdrop-filter: blur(10px);
        }

        input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 30px;
            color: white;
            outline: none;
        }

        .btn {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.2); }
        .mic-btn { font-size: 1.5rem; }
    </style>
</head>
<body>

<header>
    <div class="dev-info">
        DEVELOPED BY AMAR KUMAR <span class="blue-tick">✔</span>
    </div>
</header>

<div id="ai-container">
    <div class="ai-core" id="core"></div>
    <div id="chat-box">
        </div>
</div>

<div class="controls">
    <input type="file" id="fileInput" style="display: none;">
    <button class="btn" onclick="document.getElementById('fileInput').click()">📎</button>
    <input type="text" id="userInput" placeholder="Kuch bhi puchiye...">
    <button class="btn mic-btn" id="micBtn">🎤</button>
    <button class="btn" onclick="handleSend()">Bhejein</button>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');
    const core = document.getElementById('core');
    let userName = "";

    // --- INITIALIZATION ---
    window.onload = () => {
        addMessage("Namaste! Swarg-Core mein aapka swagat hai. Main Amar Kumar ka banaya hua Super AI hoon. Sabse pehle, aapka pyara naam kya hai?", 'bot');
    };

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}-msg`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        
        if(sender === 'bot') speak(text);
    }

    // --- EMOTIONAL INTELLIGENCE & LOGIC ---
    function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = "";

        if (!userName) {
            userName = text;
            addMessage(`Bahut sundar naam hai, ${userName}! Aaj main aapki kaise madad kar sakta hoon? Aap mujhse real-time news, images ya koi bhi sawal puch sakte hain.`, 'bot');
            return;
        }

        processAIResponse(text);
    }

    function processAIResponse(input) {
        // Mood Detection Logic
        let moodColor = "#4ecca3"; // Default Green
        let reply = "";

        if (input.includes("mazaak") || input.includes("funny")) {
            moodColor = "#ff9f43"; // Orange for Funny
            reply = "Haha! Thik hai, thoda mahol halka karte hain. Ek joke suniye...";
        } else if (input.includes("tension") || input.includes("problem")) {
            moodColor = "#ff4757"; // Red for Serious/Tense
            reply = `${userName}, fikar mat kijiye. Main ekdum serious mode mein aapka solution nikalta hoon. Bataiye kya dikkat hai?`;
        } else {
            reply = `Sahi sawal hai ${userName}. Mere real-time data ke hisab se iska jawab ye hona chahiye... (Yahan API data aayega)`;
        }

        // Change AI Core appearance based on mood
        core.style.background = `radial-gradient(circle, ${moodColor}, #000)`;
        core.style.boxShadow = `0 0 50px ${moodColor}`;

        setTimeout(() => addMessage(reply, 'bot'), 1000);
    }

    // --- VOICE FEATURE ---
    const micBtn = document.getElementById('micBtn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';

        micBtn.onclick = () => {
            recognition.start();
            micBtn.style.color = "red";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            micBtn.style.color = "white";
            handleSend();
        };
    }

    function speak(text) {
        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        synth.speak(utterance);
    }
</script>

</body>
  </html>
