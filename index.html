<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Swarg-Core God Mode | Amar Kumar</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CSS MASTER RESET & THEME --- */
        :root {
            --bg-deep: #000000;
            --card-bg: #121212;
            --neon-blue: #00e5ff;
            --gold: #ffc400;
            --user-bubble: linear-gradient(135deg, #00b4db, #0083b0);
            --ai-bubble: #1e1e1e;
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --blue-tick: #1d9bf0;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0;
        }

        body, html {
            height: 100%; width: 100%;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 2. PREMIUM HEADER (AMAR KUMAR BRANDING) --- */
        .header {
            width: 100%;
            padding: 15px 20px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .dev-info {
            display: flex;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            color: var(--gold);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .blue-tick {
            margin-left: 8px;
            width: 18px;
            height: 18px;
            background: var(--blue-tick);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            box-shadow: 0 0 10px var(--blue-tick);
        }

        /* --- 3. DYNAMIC CHAT WINDOW --- */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
        }

        #chat-container::-webkit-scrollbar { display: none; }

        .msg {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-msg {
            background: var(--ai-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-msg {
            background: var(--user-bubble);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            color: #fff;
            font-weight: 500;
        }

        /* --- 4. ANDROID SMART INPUT BAR --- */
        .input-bar {
            padding: 12px 15px;
            background: #121212;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: env(safe-area-inset-bottom, 15px);
        }

        .input-wrapper {
            flex: 1;
            background: #1e1e1e;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
            border: 1px solid #333;
        }

        #userInput {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px 0;
            font-size: 1rem;
            outline: none;
        }

        .action-icon {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            background: var(--neon-blue);
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 229, 255, 0.3);
        }

        /* --- 5. AI LOADING INDICATOR --- */
        .typing {
            font-size: 0.8rem;
            color: var(--neon-blue);
            margin-bottom: 5px;
            display: none;
        }

        /* --- BOOT SCREEN (Optimized) --- */
        #boot-loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .pulse-core {
            width: 70px;
            height: 70px;
            background: var(--neon-blue);
            border-radius: 50%;
            filter: blur(15px);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body>

<div id="boot-loader">
    <div class="pulse-core"></div>
    <h2 style="margin-top: 20px; font-family: 'Orbitron'; letter-spacing: 2px; color: var(--gold);">SWARG-CORE</h2>
</div>

<div class="header">
    <div class="dev-info">
        DEVELOPED BY AMAR KUMAR <div class="blue-tick">✔</div>
    </div>
    <div id="status-light" style="width: 10px; height: 10px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00;"></div>
</div>

<div id="chat-container">
    </div>

<div id="typing-indicator" style="padding: 0 20px; display: none;">
    <span class="typing">Swarg-AI is thinking...</span>
</div>

<div class="input-bar">
    <button class="action-icon" onclick="document.getElementById('fileInp').click()">📎</button>
    <input type="file" id="fileInp" hidden multiple accept="image/*">
    
    <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Ask anything, Boss..." autocomplete="off">
        <button class="action-icon" id="micBtn">🎤</button>
    </div>
    
    <button class="send-btn" id="sendBtn" onclick="processQuery()">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
    </button>
</div>

<script>
    /* --- JS MASTER ENGINE (GEMINI INTEGRATED) --- */
    
    // YOUR PROVIDED API KEY
    const KEY = "AIzaSyDUVk7aSZ9TvsI9YsyuUXTarSMbhHReurk";
    const URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;

    const chat = document.getElementById('chat-container');
    const input = document.getElementById('userInput');
    const loader = document.getElementById('boot-loader');
    const typing = document.getElementById('typing-indicator');
    let userName = "";

    // 1. FAST BOOT
    window.onload = () => {
        setTimeout(() => {
            loader.style.display = 'none';
            addMessage("Swarg-Core Ultimate Online. Developed by Amar Kumar. Aapka naam kya hai?", 'ai');
        }, 1200); // Only 1.2s delay for better UX
    };

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}-msg`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
        if(sender === 'ai') speak(text);
    }

    async function processQuery() {
        const query = input.value.trim();
        if(!query) return;

        addMessage(query, 'user');
        input.value = "";
        
        if(!userName) {
            userName = query;
            addMessage(`Namaste ${userName}! Main Amar Kumar ka sentient AI hoon. Ab aap mujhse koi bhi sawal puch sakte hain, main real-time data nikal kar dunga.`, 'ai');
            return;
        }

        typing.style.display = 'block';

        // 2. REAL GEMINI API CALL
        try {
            const response = await fetch(URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: query }] }]
                })
            });

            const data = await response.json();
            const aiReply = data.candidates[0].content.parts[0].text;
            
            typing.style.display = 'none';
            addMessage(aiReply, 'ai');
        } catch (err) {
            typing.style.display = 'none';
            addMessage("Kshama karein, neural link mein kuch dikat hai. Amar Kumar se contact karein.", 'ai');
        }
    }

    // 3. PREMIUM VOICE ENGINE
    const micBtn = document.getElementById('micBtn');
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'hi-IN';

    micBtn.onclick = () => {
        recognition.start();
        micBtn.style.color = "red";
    };

    recognition.onresult = (e) => {
        input.value = e.results[0][0].transcript;
        micBtn.style.color = "var(--text-dim)";
        processQuery();
    };

    function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        window.speechSynthesis.speak(utterance);
    }

    // ENTER KEY SUPPORT
    input.addEventListener("keypress", (e) => {
        if(e.key === "Enter") processQuery();
    });
</script>

</body>
                                                                </html>
